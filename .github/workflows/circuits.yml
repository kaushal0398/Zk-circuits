name: Circuit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  circom:
    name: Compile Circom circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Circom dependencies
        working-directory: circom
        run: npm install
      - name: Compile all Circom circuits
        working-directory: circom
        run: npm test

  noir:
    name: Test Noir packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          "$HOME/.nargo/bin/noirup" --version 0.36.0
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - name: Check and test Noir packages
        run: |
          for package in noir/*; do
            if [ -f "$package/Nargo.toml" ]; then
              (cd "$package" && nargo check && nargo test)
            fi
          done
